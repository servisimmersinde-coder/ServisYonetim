<style>

.basari-toast{position:fixed;top:20px;right:20px;background:#16a34a;color:#fff;padding:14px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:2000;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideIn .3s ease}

<body>
<div id="app"></div>
<script>
const API='';
let db={kullanicilar:[],musteriler:[],servisler:[]};
let aktifKullanici=null;let aktifMenu='dashboard';let modal=null;let modalData=null;let servisForm=null;
(function(){try{const k=localStorage.getItem('sy_kullanici');if(k){aktifKullanici=JSON.parse(k);}}catch(e){}})();

async function apiFetch(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+url,opts);
  return await r.json();
}

async function yukle(){db=await apiFetch('/api/db');}
function g(id){return document.getElementById(id)?.value||'';}
function tarih(d){return d?new Date(d).toLocaleDateString('tr-TR'):'-'}
function tamTarih(d){return d?new Date(d).toLocaleString('tr-TR'):'-'}
function para(n){return Number(n||0).toLocaleString('tr-TR')+' TL'}
function rolAd(r){return r==='yonetici'?'Yonetici':r==='alt_yonetici'?'Alt Yonetici':'Kullanici'}
function durumAd(d){return d==='beklemede'?'Beklemede':d==='islemde'?'Islemde':d==='tamamlandi'?'Tamamlandi':d==='yolda'?'Yolda':'Iptal'}
function durumBadge(d){const cls={beklemede:'b-be',islemde:'b-is',tamamlandi:'b-ta',iptal:'b-ip',yolda:'b-ay'};return`<span class="b ${cls[d]||'b-be'}">${durumAd(d)}</span>`;}
function rolBadge(r){const cls={yonetici:'yo',alt_yonetici:'ay',kullanici:'ku'};return`<span class="b b-${cls[r]||'ku'}" style="font-size:11px">${rolAd(r)}</span>`;}
function getKullaniciAd(id){return id?(db.kullanicilar.find(k=>k.id===id)?.adSoyad||'-'):'-';}
function getMusteri(id){return db.musteriler.find(m=>m.id===id);}
function yoneticiMi(k){return k.rol==='yonetici'||k.rol==='alt_yonetici';}
function bekleyenIsSayisi(){if(!aktifKullanici)return 0;if(yoneticiMi(aktifKullanici))return db.servisler.filter(s=>s.durum==='beklemede').length;return db.servisler.filter(s=>s.atananKullanici===aktifKullanici.id&&(s.durum==='beklemede'||s.durum==='islemde')).length;}
function sonAtananServis(){if(!aktifKullanici||yoneticiMi(aktifKullanici))return null;const sv=db.servisler.filter(s=>s.atananKullanici===aktifKullanici.id);return sv.length>0?sv[sv.length-1]:null;}

function showToast(msg){
  const t=document.createElement('div');t.className='basari-toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3000);
}

function bildirimMesajiOlustur(servis){
  const m=getMusteri(servis.musteriId);
  const musteriAdi=m?m.adSoyad:'Musteri';
  const urun=servis.urun||'urun';
  const durum=durumAd(servis.durum);
  const fisNo=servis.fisNo;
  return`Sayin ${musteriAdi}, ${urun} servisiniz hakkinda bilgilendirme: ${durum}. Servis No: ${fisNo}. Servis Yonetim Sistemi`;
}

function bildirimGonder(servisId,tip){
  const s=db.servisler.find(x=>x.id===servisId);
  if(!s)return;
  const m=getMusteri(s.musteriId);
  if(!m||!m.telefon){alert('Musteri telefon numarasi bulunamadi');return;}
  const mesaj=bildirimMesajiOlustur(s);
  const telefonRaw=m.telefon.replace(/\s/g,'').replace(/^0/,'');
  const encodedMesaj=encodeURIComponent(mesaj);
  if(tip==='whatsapp'){
    window.open(`https://wa.me/90${telefonRaw}?text=${encodedMesaj}`,'_blank');
  }else{
    window.open(`sms:90${telefonRaw}?body=${encodedMesaj}`,'_blank');
  }
  if(!s.bildirimler)s.bildirimler=[];
  s.bildirimler.push({tip,tarih:new Date().toISOString(),mesaj});
  apiFetch(`/api/servis/${servisId}`,'PUT',{bildirimler:s.bildirimler});
  showToast(`${tip==='whatsapp'?'WhatsApp':'SMS'} bildirimi gonderildi`);
}

function bildirimGecmisiHtml(servis){
  const bildirimler=servis.bildirimler||[];
  if(bildirimler.length===0)return'';
  return`<div class="bildirim-gecmisi"><h4>Bildirim Gecmisi</h4>
    ${bildirimler.slice().reverse().map(b=>`<div class="bildirim-gecmisi-item">
      <div class="bildirim-gecmisi-icon" style="background:${b.tip==='whatsapp'?'#dcfce7':'#e0f2fe'}">
        ${b.tip==='whatsapp'?'&#128172;':'&#128241;'}
      </div>
      <div style="flex:1">
        <div style="font-weight:600;color:#374151">${b.tip==='whatsapp'?'WhatsApp':'SMS'} <span style="font-weight:400;color:#9ca3af">- ${tamTarih(b.tarih)}</span></div>
        <div class="bildirim-gecmisi-mesaj">${b.mesaj}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

function showBildirimToast(servisId,mesaj){
  const t=document.createElement('div');
  t.className='bildirim-toast';
  t.innerHTML=`<span>${mesaj}</span><button class="btn btn-wa btn-s" onclick="bildirimGonder('${servisId}','whatsapp')">&#128172; WhatsApp</button><button class="btn btn-sms btn-s" onclick="bildirimGonder('${servisId}','sms')">&#128241; SMS</button>`;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},6000);
}

function cizGrafik(canvasId,servisler){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const container=canvas.parentElement;
  const w=container.clientWidth-40;
  const h=200;
  canvas.width=w*dpr;
  canvas.height=h*dpr;
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  const gunIsimleri=['Pzt','Sal','Car','Per','Cum','Cmt','Paz'];
  const bugun=new Date();
  const son7gun=[];
  for(let i=6;i>=0;i--){
    const t=new Date(bugun);
    t.setDate(bugun.getDate()-i);
    t.setHours(0,0,0,0);
    const gunIndex=(t.getDay()+6)%7;
    son7gun.push({tarih:t.getTime(),gun:gunIsimleri[gunIndex],sayi:0});
  }
  servisler.forEach(s=>{
    if(!s.tarih)return;
    const st=new Date(s.tarih);
    st.setHours(0,0,0,0);
    const found=son7gun.find(d=>d.tarih===st.getTime());
    if(found)found.sayi++;
  });
  const pad={top:30,right:20,bottom:40,left:20};
  const cw=w-pad.left-pad.right;
  const ch=h-pad.top-pad.bottom;
  const maxVal=Math.max(...son7gun.map(d=>d.sayi),1);
  const gap=cw/7;
  const bw=gap*0.55;
  ctx.clearRect(0,0,w,h);
  son7gun.forEach((d,i)=>{
    const x=pad.left+i*gap+(gap-bw)/2;
    const bh=(d.sayi/maxVal)*ch;
    const y=pad.top+ch-bh;
    ctx.fillStyle='#2563eb';
    ctx.beginPath();
    if(typeof ctx.roundRect==='function'){
      ctx.roundRect(x,y,bw,bh,[4,4,0,0]);
    }else{
      ctx.rect(x,y,bw,bh);
    }
    ctx.fill();
    ctx.fillStyle='#374151';
    ctx.font='bold 12px Segoe UI, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(d.sayi,x+bw/2,y-6);
    ctx.fillStyle='#6b7280';
    ctx.font='11px Segoe UI, sans-serif';
    ctx.fillText(d.gun,x+bw/2,h-pad.bottom+16);
  });
  ctx.strokeStyle='#e5e7eb';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(pad.left,pad.top+ch);
  ctx.lineTo(w-pad.right,pad.top+ch);
  ctx.stroke();
}

  await apiFetch(`/api/servis/${id}`,'PUT',data);
  await render();
  const s=db.servisler.find(x=>x.id===id);
  if(s){
    const m=getMusteri(s.musteriId);
    const mesaj=`${m?m.adSoyad:'Musteri'} musterisiniz ${durumAd(durum)} durumuna gecti. Servis No: ${s.fisNo}`;

async function profilKaydet(e){
  e.preventDefault();
  const k=aktifKullanici;
  const data={};
  const yeniAd=g('pAd').trim();
  if(yeniAd&&yeniAd!==k.adSoyad)data.adSoyad=yeniAd;
  const eskiSifre=g('pEskiSifre'),yeniSifre=g('pYeniSifre'),yeniSifre2=g('pYeniSifre2');
  if(eskiSifre||yeniSifre||yeniSifre2){
    if(!eskiSifre||!yeniSifre||!yeniSifre2){document.getElementById('profilMesaj').innerHTML='<div class="err">Tum sifre alanlarini doldurun</div>';return;}
    if(eskiSifre!==k.sifre){document.getElementById('profilMesaj').innerHTML='<div class="err">Mevcut sifre yanlis</div>';return;}
    if(yeniSifre!==yeniSifre2){document.getElementById('profilMesaj').innerHTML='<div class="err">Yeni sifreler eslesmiyor</div>';return;}
    if(yeniSifre.length<4){document.getElementById('profilMesaj').innerHTML='<div class="err">Sifre en az 4 karakter olmali</div>';return;}
    data.sifre=yeniSifre;
  }
  if(Object.keys(data).length===0){document.getElementById('profilMesaj').innerHTML='<div class="err">Degisiklik yapilmadi</div>';return;}
  const r=await apiFetch('/api/kullanici/'+k.id,'PUT',data);
  if(r.ok){
    Object.assign(aktifKullanici,data);localStorage.setItem('sy_kullanici',JSON.stringify(aktifKullanici));
    document.getElementById('profilMesaj').innerHTML='<div class="ok-msg">Profil basariyla guncellendi</div>';
    setTimeout(()=>{render();},500);
  } else {
    document.getElementById('profilMesaj').innerHTML=`<div class="err">${r.hata||'Hata olustu'}</div>`;
  }
}

function renderModal(){

  let html='';switch(modal){

          <div class="flex jcsb aic mb4"><b style="font-size:13px">Fotograflar</b></div>
          <div class="foto-grid">
            ${f.fotolar.length>0?f.fotolar.map((fo,idx)=>`<div class="foto-item"><img src="${fo}" onerror="this.style.display='none'"><button type="button" class="foto-sil" onclick="servisForm.fotolar.splice(${idx},1);render()">X</button></div>`).join(''):''}
            <label class="foto-yukle-btn" title="Fotograf Ekle">+<input type="file" accept="image/*" style="display:none" onchange="fotoYukle(event)"></label>
          </div>
        </div>
        <div class="fg"><label>Notlar</label><textarea id="sNot" rows="2">${f.notlar||''}</textarea></div>
      </div>
      <div class="ma"><button type="button" class="btn btn-g btn-s" onclick="servisForm=null;modal=null;render()">Iptal</button><button type="submit" class="btn btn-ok btn-s">Kaydet</button></div>
    </form>`;
}

function musteriSecildi(){
  const mid=g('sMusteriSecim');
  if(servisForm)servisForm.musteriSecimId=mid;
}

function fotoYukle(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    if(!servisForm)servisForm={fotolar:[]};
    if(!servisForm.fotolar)servisForm.fotolar=[];
    servisForm.fotolar.push(ev.target.result);
    modal='yeniServis';render();
  };
  reader.readAsDataURL(file);
}

function mIslem(){return`<h2>Islem Ekle</h2><div class="fg"><label>Aciklama *</label><input type="text" id="iIslem" placeholder="Islem aciklamasi"></div><div class="fg"><label>Tutar (TL) *</label><input type="number" id="iTutar" min="0"></div><div class="ma"><button class="btn btn-g btn-s" onclick="modal='yeniServis';render()">Geri</button><button class="btn btn-ok btn-s" onclick="islemEkle()">Ekle</button></div>`;}
function islemEkle(){const i=g('iIslem'),t=Number(g('iTutar'))||0;if(!i){alert('Gerekli');return;}servisForm.yapilanIslemler.push({islem:i,tutar:t});modal='yeniServis';render();}

function mParca(){return`<h2>Parca Ekle</h2><div class="fg"><label>Parca *</label><input type="text" id="pAck" placeholder="Parca aciklamasi"></div><div class="fr"><div class="fg"><label>Adet *</label><input type="number" id="pAdet" value="1" min="1"></div><div class="fg"><label>Birim Fiyat *</label><input type="number" id="pFiyat" min="0"></div></div><div class="ma"><button class="btn btn-g btn-s" onclick="modal='yeniServis';render()">Geri</button><button class="btn btn-ok btn-s" onclick="parcaEkle()">Ekle</button></div>`;}
function parcaEkle(){const a=g('pAck'),ad=Number(g('pAdet'))||1,bf=Number(g('pFiyat'))||0;if(!a){alert('Gerekli');return;}servisForm.parcalar.push({adet:ad,birimFiyat:bf,toplam:ad*bf,aciklama:a});modal='yeniServis';render();}

async function servisKaydet(e){
  e.preventDefault();
  const f=servisForm;
  let musteriId='';
  if(f&&f.yeniMusteri){
    const yAdSoyad=(g('sYAdSoyad')||'').trim();
    const yTelefon=(g('sYTelefon')||'').trim();
    const yAdres=(g('sYAdres')||'').trim();
    if(!yAdSoyad){alert('Musteri adi soyadi gerekli');return;}
    if(!yTelefon){alert('Telefon gerekli');return;}
    if(!yAdres){alert('Adres gerekli');return;}
    const yeniMusteri={adSoyad:yAdSoyad,telefon:yTelefon,adres:yAdres,urun:g('sUrun')||'',marka:g('sMarka')||'',model:g('sModel')||'',sikayet:g('sAriza')||'',ekleyen:aktifKullanici.id};
    const mr=await apiFetch('/api/musteri','POST',yeniMusteri);
    if(mr&&mr.id){musteriId=mr.id;db.musteriler.push(mr);}
    else{alert('Musteri eklenemedi');return;}
  }else{
    musteriId=g('sMusteriSecim');
    if(!musteriId){alert('Musteri seciniz');return;}
  }
  const servisTipi=g('sTip'),atananKullanici=g('sAta'),ucret=Number(g('sUcret'))||0;
  const urun=g('sUrun'),marka=g('sMarka'),model=g('sModel');
  const arizaSikayeti=g('sAriza'),notlar=g('sNot')||'';

  if(!urun){alert('Urun seciniz');return;}
  if(!arizaSikayeti.trim()){alert('Ariza sikayet alanini doldurun');return;}
  if(!servisTipi){alert('Servis tipi zorunlu');return;}
  if(!atananKullanici){alert('Sorumlu kullanici seciniz');return;}

  const data={
    musteriId,servisTipi,aciklama:arizaSikayeti,notlar,atananKullanici,durum:'beklemede',ekleyen:aktifKullanici.id,
    urun,marka,model,arizaSikayeti,
    yapilanIslemler:f?f.yapilanIslemler:[],parcalar:f?f.parcalar:[],
    fotolar:f?f.fotolar:[],
    indirimOrani:0,kdvOrani:20,
    kdvDahilToplam:ucret,toplamTutar:ucret,indirimliTutar:ucret
  };
  await apiFetch('/api/servis','POST',data);
  servisForm=null;modal=null;
  const atananAd=getKullaniciAd(atananKullanici);
  showToast(`Servis basariyla olusturuldu! Atanan: ${atananAd}`);
  aktifMenu='servisler';render();
}

function mDetay(){
  const s=db.servisler.find(x=>x.id===modalData);if(!s)return'<p>Bulunamadi</p>';const m=getMusteri(s.musteriId);
  return`<h2>Detay - ${s.fisNo}</h2><div class="flex g2 mb4">${durumBadge(s.durum)}${s.atananKullanici?`<span class="b b-is">Atanan: ${getKullaniciAd(s.atananKullanici)}</span>`:''}</div>
    <div style="background:#f9fafb;padding:12px;border-radius:8px;margin-bottom:10px"><div class="fr"><div><b>Musteri:</b> ${m?m.adSoyad:'-'}</div><div><b>Tel:</b> ${m?m.telefon:'-'}</div></div><div class="fr"><div><b>Adres:</b> ${m?m.adres||'-':'-'}</div><div><b>Servis:</b> ${s.servisTipi}</div></div></div>
    <div style="background:#f9fafb;padding:12px;border-radius:8px;margin-bottom:10px"><div class="fr"><div><b>Urun:</b> ${s.urun||'-'}</div><div><b>Marka:</b> ${s.marka||'-'} &nbsp; <b>Model:</b> ${s.model||'-'}</div></div></div>
    <div style="background:#f9fafb;padding:12px;border-radius:8px;margin-bottom:10px"><div class="flex jcsb"><b>Sikayet:</b><span>${s.arizaSikayeti||s.aciklama||'-'}</span></div></div>
    <div style="background:#f9fafb;padding:12px;border-radius:8px;margin-bottom:10px"><div class="flex jcsb"><b>Toplam (KDV Dahil):</b><b style="color:var(--p);font-size:16px">${para(s.kdvDahilToplam)}</b></div></div>
    ${(s.fotolar&&s.fotolar.length>0)?`<div class="card"><b>Fotograflar</b><div class="foto-grid" style="margin-top:8px">${s.fotolar.map(f=>`<div class="foto-item"><img src="${f}" onerror="this.style.display='none'"></div>`).join('')}</div></div>`:''}
    ${s.sonuc?`<div class="sonuc-alan"><h4>Sonuc</h4><p style="white-space:pre-wrap;font-size:13px">${s.sonuc}</p></div>`:''}
    ${bildirimGecmisiHtml(s)}
    <div class="ma">${m&&m.telefon?`<button class="btn btn-wa btn-s" onclick="bildirimGonder('${s.id}','whatsapp')">&#128172; WhatsApp</button><button class="btn btn-sms btn-s" onclick="bildirimGonder('${s.id}','sms')">&#128241; SMS</button>`:''}<button class="btn btn-ok btn-s" onclick="fisGoster('${s.id}')">Fis</button><button class="btn btn-g btn-s" onclick="modal=null;render()">Kapat</button></div>`;
}

render();
</script>
</body>
</html>
