<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servis Yonetim Sistemi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f2f5;color:#1f2937}
:root{--p:#2563eb;--pd:#1d4ed8;--ok:#16a34a;--okd:#15803d;--w:#f59e0b;--d:#dc2626;--info:#0891b2;--card:#fff;--border:#e5e7eb;--r:8px;--sh:0 1px 3px rgba(0,0,0,.12)}
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a8a 50%,#2563eb);padding:16px}
.login-card{background:#fff;padding:36px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:380px}
.login-card h1{text-align:center;color:var(--p);margin-bottom:4px;font-size:24px}
.login-card .sub{text-align:center;color:#6b7280;margin-bottom:24px;font-size:13px}
.login-tabs{display:flex;margin-bottom:24px;border:2px solid var(--border);border-radius:var(--r);overflow:hidden}
.login-tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;background:#f9fafb;color:#6b7280;transition:.2s;border:none}
.login-tab.active{background:var(--p);color:#fff}
.fg{margin-bottom:14px}
.fg label{display:block;margin-bottom:5px;font-weight:600;font-size:13px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);font-size:14px;transition:.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--p)}
.btn{padding:9px 18px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-p{background:var(--p);color:#fff;width:100%}.btn-p:hover{background:var(--pd)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:var(--okd)}
.btn-w{background:var(--w);color:#fff}.btn-d{background:var(--d);color:#fff}
.btn-i{background:var(--info);color:#fff}.btn-g{background:#6b7280;color:#fff}
.btn-s{padding:5px 10px;font-size:12px}
.btn-tel{background:#25d366;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--r);font-size:12px;font-weight:600}
.btn-tel:hover{background:#1da851}
.err{color:var(--d);font-size:12px;margin-bottom:10px;padding:8px;background:#fee2e2;border-radius:6px}
.layout{display:flex;min-height:100vh}
.side{width:250px;background:linear-gradient(180deg,#0f172a,#1e293b);color:#fff;position:fixed;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:100}
.side-hd{padding:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-hd h2{font-size:16px;margin-bottom:2px}.side-hd p{font-size:11px;opacity:.5}
.side-nav{padding:8px 0;flex:1}
.side-nav a{display:flex;align-items:center;gap:11px;padding:11px 20px;color:rgba(255,255,255,.65);text-decoration:none;transition:.15s;font-size:13px;border-left:3px solid transparent}
.side-nav a:hover,.side-nav a.act{background:rgba(255,255,255,.06);color:#fff;border-left-color:var(--p)}
.side-nav a .ic{font-size:16px;width:20px;text-align:center}
.side-nav .badge{background:var(--d);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;margin-left:auto}
.side-ft{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08)}
.side-ft .uinfo{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.side-ft .uav{width:34px;height:34px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.side-ft .un{font-size:13px;font-weight:600}.side-ft .ur{font-size:10px;opacity:.5;text-transform:uppercase}
.main{margin-left:250px;flex:1;padding:24px;min-height:100vh}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.ph h1{font-size:22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.sc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;align-items:center;gap:12px}
.si{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px}
.si.bl{background:#dbeafe}.si.yl{background:#fef3c7}.si.gr{background:#dcfce7}.si.tl{background:#ccfbf1}.si.gn{background:#dcfce7}.si.rd{background:#fee2e2}
.sc h3{font-size:20px}.sc p{font-size:11px;color:#6b7280}
.tc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
table th,table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
table th{background:#f9fafb;font-weight:600;white-space:nowrap}
table tr:hover{background:#f9fafb}
.b{padding:3px 9px;border-radius:16px;font-size:10px;font-weight:600;display:inline-block;white-space:nowrap}
.b-be{background:#fef3c7;color:#92400e}.b-is{background:#dbeafe;color:#1e40af}.b-ta{background:#dcfce7;color:#166534}.b-ip{background:#fee2e2;color:#991b1b}.b-ay{background:#f3e8ff;color:#6b21a8}.b-ku{background:#e0f2fe;color:#075985}.b-yo{background:#dbeafe;color:#1e40af}.b-yz{background:#dcfce7;color:#166534}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.md{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.md h2{margin-bottom:16px;font-size:18px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sb{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.sb input,.sb select{flex:1;min-width:120px;padding:9px 12px;border:2px solid var(--border);border-radius:var(--r);font-size:13px}
.sonuc-alan{background:#f0fdf4;border:2px solid #bbf7d0;border-radius:8px;padding:14px;margin-top:12px}
.sonuc-alan h4{color:#166534;margin-bottom:8px;font-size:13px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 2s infinite}
@media print{.side,.ph,.btn,.sb,.no-print{display:none!important}.main{margin:0!important;padding:0!important}}
.tc2{text-align:center;padding:36px;color:#6b7280}.tc2 .eic{font-size:44px;margin-bottom:10px}
.flex{display:flex}.aic{align-items:center}.jcsb{justify-content:space-between}.g2{gap:8px}.mb2{margin-bottom:8px}.mb4{margin-bottom:16px}
.is-kart{background:#fff;border:2px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;transition:.2s}
.is-kart:hover{border-color:var(--p);box-shadow:0 4px 12px rgba(37,99,235,.15)}
.is-kart .kart-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.is-kart .kart-musteri{font-size:16px;font-weight:700;margin-bottom:4px}
.is-kart .kart-bilgi{font-size:12px;color:#6b7280;line-height:1.8}
.is-kart .kart-bilgi b{color:#374151}
.is-kart .kart-aksiyon{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.yeni-is-btn{background:linear-gradient(135deg,var(--ok),var(--okd));color:#fff;border:none;border-radius:12px;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(22,163,74,.3)}
.yeni-is-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(22,163,74,.4)}
.bolum-ayir{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API='';
let db={kullanicilar:[],musteriler:[],servisler:[]};
let aktifKullanici=null;let aktifMenu='dashboard';let modal=null;let modalData=null;let servisForm=null;

async function apiFetch(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+url,opts);
  return await r.json();
}

async function yukle(){db=await apiFetch('/api/db');}
function g(id){return document.getElementById(id)?.value||'';}
function tarih(d){return d?new Date(d).toLocaleDateString('tr-TR'):'-'}
function tamTarih(d){return d?new Date(d).toLocaleString('tr-TR'):'-'}
function para(n){return Number(n||0).toLocaleString('tr-TR')+' TL'}
function rolAd(r){return r==='yonetici'?'Yonetici':r==='alt_yonetici'?'Alt Yonetici':'Kullanici'}
function durumAd(d){return d==='beklemede'?'Beklemede':d==='islemde'?'Islemde':d==='tamamlandi'?'Tamamlandi':d==='yolda'?'Yolda':'Iptal'}
function durumBadge(d){const cls={beklemede:'b-be',islemde:'b-is',tamamlandi:'b-ta',iptal:'b-ip',yolda:'b-ay'};return'<span class="b '+(cls[d]||'be')+'">'+durumAd(d)+'</span>';}
function rolBadge(r){return'<span class="b b-'+(r==='yonetici'?'yo':r==='alt_yonetici'?'ay':'ku')+'" style="font-size:11px">'+rolAd(r)+'</span>';}
function getKullaniciAd(id){return id?(db.kullanicilar.find(k=>k.id===id)?.adSoyad||'-'):'-';}
function getMusteri(id){return db.musteriler.find(m=>m.id===id);}
function bekleyenIsSayisi(){if(!aktifKullanici)return 0;if(yoneticiMi(aktifKullanici))return db.servisler.filter(s=>s.durum==='beklemede').length;return db.servisler.filter(s=>s.atananKullanici===aktifKullanici.id&&(s.durum==='beklemede'||s.durum==='islemde')).length;}

async function render(){
  await yukle();
  const app=document.getElementById('app');
  if(!aktifKullanici){app.innerHTML=renderLogin();bindLogin();}
  else{app.innerHTML=renderLayout(aktifKullanici);bindLayout(aktifKullanici);}
  if(modal)renderModal();
}

function renderLogin(){
  const tab=window._loginTab||'pc';
  return'<div class="login-bg"><div class="login-card">'+
  '<h1>Servis Yonetim</h1><p class="sub">Hesabiniza giris yapin</p>'+
  '<div class="login-tabs">'+
    '<button class="login-tab '+(tab==='pc'?'active':'')+'" onclick="window._loginTab=\'pc\';render()">PC Giris</button>'+
    '<button class="login-tab '+(tab==='tel'?'active':'')+'" onclick="window._loginTab=\'tel\';render()">Telefon Giris</button>'+
  '</div>'+
  '<div id="loginHata"></div>'+
  '<form id="loginForm">'+
    (tab==='pc'?'<div class="fg"><label>Email</label><input type="email" id="lEmail" placeholder="ornek@gmail.com" required></div>'
    :'<div class="fg"><label>Telefon</label><input type="tel" id="lTel" placeholder="05XX XXX XX XX" required maxlength="11"></div>')+
    '<div class="fg"><label>Sifre</label><input type="password" id="lSifre" placeholder="Sifreniz" required minlength="4"></div>'+
    '<button type="submit" class="btn btn-p">Giris Yap</button>'+
  '</form></div></div>';
}

function bindLogin(){
  document.getElementById('loginForm')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const sifre=g('lSifre'),tab=window._loginTab||'pc';
    const body=tab==='pc'?{email:g('lEmail').trim(),sifre,tab:'pc'}:{telefon:g('lTel').replace(/\s/g,''),sifre,tab:'tel'};
    const r=await apiFetch('/api/giris','POST',body);
    if(r.hata){document.getElementById('loginHata').innerHTML='<div class="err">'+r.hata+'</div>';return;}
    aktifKullanici=r.kullanici;aktifMenu='dashboard';render();
  });
}

function renderLayout(k){
  const yr=k.rol==='yonetici',ay=k.rol==='alt_yonetici',ku=k.rol==='kullanici';
  const bekleyen=bekleyenIsSayisi();
  return'<div class="layout">'+
  '<aside class="side">'+
    '<div class="side-hd"><h2>Servis Yonetim</h2><p>'+rolAd(k.rol)+'</p></div>'+
    '<nav class="side-nav">'+
      '<a href="#" data-menu="dashboard" class="'+(aktifMenu==='dashboard'?'act':'')+'"><span class="ic">&#127968;</span> Dashboard</a>'+
      (yr||ay?'<a href="#" data-menu="servisler" class="'+(aktifMenu==='servisler'?'act':'')+'"><span class="ic">&#128295;</span> Servisler'+(bekleyen>0?'<span class="badge pulse">'+bekleyen+'</span>':'')+'</a>':'')+
      (yr||ay?'<a href="#" data-menu="musteriler" class="'+(aktifMenu==='musteriler'?'act':'')+'"><span class="ic">&#128100;</span> Musteriler</a>':'')+
      (yr?'<a href="#" data-menu="kullanicilar" class="'+(aktifMenu==='kullanicilar'?'act':'')+'"><span class="ic">&#128101;</span> Kullanicilar</a>':'')+
      (ku?'<a href="#" data-menu="islerim" class="'+(aktifMenu==='islerim'?'act':'')+'"><span class="ic">&#128203;</span> Islerim'+(bekleyen>0?'<span class="badge pulse">'+bekleyen+'</span>':'')+'</a>':'')+
    '</nav>'+
    '<div class="side-ft">'+
      '<div class="uinfo"><div class="uav">'+(k.adSoyad||'?')[0]+'</div><div><div class="un">'+k.adSoyad+'</div><div class="ur">'+rolAd(k.rol)+' | '+(k.email||k.telefon||'')+'</div></div></div>'+
      '<button class="btn btn-d btn-s" style="width:100%" onclick="aktifKullanici=null;render()">Cikis Yap</button>'+
    '</div>'+
  '</aside>'+
  '<main class="main" id="mainContent"></main></div>';
}

function bindLayout(k){
  document.querySelectorAll('.side-nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();aktifMenu=a.dataset.menu;modal=null;render();}));
  const mc=document.getElementById('mainContent');
  switch(aktifMenu){
    case'dashboard':renderDashboard(mc,k);break;case'servisler':renderServisler(mc,k);break;
    case'musteriler':renderMusteriler(mc,k);break;case'kullanicilar':if(yoneticiMi(k))renderKullanicilar(mc,k);break;
    case'islerim':renderIslerim(mc,k);break;case'isDetay':renderIsDetay(mc,k);break;
    default:renderDashboard(mc,k);
  }
}
function yoneticiMi(k){return k.rol==='yonetici'||k.rol==='alt_yonetici';}

function renderDashboard(mc,k){
  const yr=k.rol==='yonetici',ay=k.rol==='alt_yonetici',ku=k.rol==='kullanici';
  let sv=db.servisler;
  if(ku)sv=sv.filter(s=>s.atananKullanici===k.id);
  else if(ay)sv=sv.filter(s=>s.ekleyen===k.id);
  const toplam=sv.length,bekleyen=sv.filter(s=>s.durum==='beklemede').length,devam=sv.filter(s=>s.durum==='islemde'||s.durum==='yolda').length,tamam=sv.filter(s=>s.durum==='tamamlandi').length;
  const gelir=sv.filter(s=>s.durum==='tamamlandi').reduce((a,s)=>a+(s.kdvDahilToplam||0),0);
  const son=sv.slice(-5).reverse();
  mc.innerHTML='<div class="ph"><h1>Merhaba, '+k.adSoyad+'</h1>'+
    (yr||ay?'<button class="yeni-is-btn" onclick="modal=\'yeniServis\';render()">+ Yeni Is Kaydi</button>':'')+'</div>'+
    '<div class="sg">'+
      '<div class="sc"><div class="si bl">&#128295;</div><div><h3>'+toplam+'</h3><p>Toplam Servis</p></div></div>'+
      '<div class="sc"><div class="si yl">&#9203;</div><div><h3>'+bekleyen+'</h3><p>Bekleyen</p></div></div>'+
      '<div class="sc"><div class="si tl">&#128736;</div><div><h3>'+devam+'</h3><p>Devam Eden</p></div></div>'+
      '<div class="sc"><div class="si gr">&#9989;</div><div><h3>'+tamam+'</h3><p>Tamamlanan</p></div></div>'+
      (yr||ay?'<div class="sc"><div class="si gn">&#8378;</div><div><h3>'+para(gelir)+'</h3><p>Gelir</p></div></div>':'')+
    '</div>'+
    '<div class="card"><div class="flex jcsb aic mb4"><h3 style="font-size:16px">Son Servisler</h3></div>'+
    (son.length===0?'<div class="tc2"><div class="eic">&#128295;</div><p>Henuz servis yok</p></div>':
    '<div class="tc"><table><thead><tr><th>Fis No</th><th>Musteri</th><th>Servis</th><th>Durum</th><th>Atanan</th><th>Tutar</th></tr></thead><tbody>'+
    son.map(s=>{const m=getMusteri(s.musteriId);return'<tr><td><b>'+s.fisNo+'</b></td><td>'+(m?m.adSoyad:'-')+'</td><td>'+s.servisTipi+'</td><td>'+durumBadge(s.durum)+'</td><td>'+(s.atananKullanici?getKullaniciAd(s.atananKullanici):'-')+'</td><td>'+para(s.kdvDahilToplam)+'</td></tr>';}).join('')+
    '</tbody></table></div>')+'</div>';
}

function renderServisler(mc,k){
  let sv=k.rol==='yonetici'?db.servisler:db.servisler.filter(s=>s.ekleyen===k.id);
  mc.innerHTML='<div class="ph"><h1>Servis Kayitlari</h1><button class="yeni-is-btn" onclick="modal=\'yeniServis\';render()">+ Yeni Is Kaydi</button></div>'+
    '<div class="card"><div class="sb"><input type="text" id="srvAra" placeholder="Ara..." oninput="srvAraFiltre()"><select id="srvDurum" onchange="srvAraFiltre()"><option value="">Tum Durumlar</option><option value="beklemede">Beklemede</option><option value="islemde">Islemde</option><option value="yolda">Yolda</option><option value="tamamlandi">Tamamlandi</option><option value="iptal">Iptal</option></select></div>'+
    '<div id="srvTablo">'+srvTabloFull(sv.slice().reverse(),k)+'</div></div>';
}
function srvAraFiltre(){const k=aktifKullanici;let sv=k.rol==='yonetici'?db.servisler:db.servisler.filter(s=>s.ekleyen===k.id);const a=(g('srvAra')||'').toLowerCase(),d=g('srvDurum');if(d)sv=sv.filter(s=>s.durum===d);if(a)sv=sv.filter(s=>{const m=getMusteri(s.musteriId);return s.fisNo.toLowerCase().includes(a)||s.servisTipi.toLowerCase().includes(a)||(m&&m.adSoyad.toLowerCase().includes(a));});document.getElementById('srvTablo').innerHTML=srvTabloFull(sv.slice().reverse(),k);}
function srvTabloFull(sv,k){
  if(!sv.length)return'<div class="tc2"><div class="eic">&#128295;</div><p>Servis bulunamadi</p></div>';
  return'<div class="tc"><table><thead><tr><th>Fis No</th><th>Musteri</th><th>Plaka</th><th>Servis</th><th>Durum</th><th>Atanan</th><th>Sonuc</th><th>Tutar</th><th>Islem</th></tr></thead><tbody>'+
  sv.map(s=>{const m=getMusteri(s.musteriId);return'<tr><td><b>'+s.fisNo+'</b></td><td>'+(m?m.adSoyad:'-')+'</td><td>'+(m?m.plaka||'-':'-')+'</td><td>'+s.servisTipi+'</td><td>'+durumBadge(s.durum)+'</td><td>'+(s.atananKullanici?getKullaniciAd(s.atananKullanici):'-')+'</td><td>'+(s.sonuc?'<span class="b b-yz">Yazildi</span>':'<span class="b b-be">Bekliyor</span>')+'</td><td>'+para(s.kdvDahilToplam)+'</td><td><div class="flex g2"><button class="btn btn-i btn-s" onclick="modal=\'detayServis\';modalData=\''+s.id+'\';render()">Gor</button><button class="btn btn-ok btn-s" onclick="fisGoster(\''+s.id+'\')">Fis</button>'+(k.rol==='yonetici'?'<button class="btn btn-d btn-s" onclick="servisSil(\''+s.id+'\')">Sil</button>':'')+'</div></td></tr>';}).join('')+'</tbody></table></div>';
}
async function servisSil(id){if(!confirm('Bu servis kaydi silinsin mi?'))return;await apiFetch('/api/servis/'+id,'DELETE');render();}

function renderMusteriler(mc,k){
  let ml=k.rol==='yonetici'?db.musteriler:db.musteriler.filter(m=>m.ekleyen===k.id);
  mc.innerHTML='<div class="ph"><h1>Musteriler</h1><button class="yeni-is-btn" onclick="modal=\'yeniMusteri\';render()">+ Yeni Musteri</button></div>'+
    '<div class="card"><div class="sb"><input type="text" id="musAra" placeholder="Ara..." oninput="musAraFiltre()"></div>'+
    '<div id="musTablo">'+musTablo(ml)+'</div></div>';
}
function musAraFiltre(){const k=aktifKullanici;let ml=k.rol==='yonetici'?db.musteriler:db.musteriler.filter(m=>m.ekleyen===k.id);const a=(g('musAra')||'').toLowerCase();if(a)ml=ml.filter(m=>(m.adSoyad+m.telefon+m.plaka).toLowerCase().includes(a));document.getElementById('musTablo').innerHTML=musTablo(ml);}
function musTablo(ml){
  if(!ml.length)return'<div class="tc2"><div class="eic">&#128100;</div><p>Musteri yok</p></div>';
  return'<div class="tc"><table><thead><tr><th>Ad Soyad</th><th>Telefon</th><th>Plaka</th><th>Arac</th><th>Islem</th></tr></thead><tbody>'+

  if(!musteriId||!servisTipi){alert('Musteri ve Servis Tipi zorunlu');return;}
  if(!atananKullanici){alert('Sorumlu kullanici seciniz');return;}
  const data={musteriId,servisTipi,aciklama,notlar,atananKullanici,durum:'beklemede',ekleyen:aktifKullanici.id,
    yapilanIslemler:servisForm?servisForm.yapilanIslemler:[],parcalar:servisForm?servisForm.parcalar:[],
    indirimOrani:servisForm?servisForm.indirimOrani:0,kdvOrani:servisForm?servisForm.kdvOrani:20,
    kdvDahilToplam:ucret,toplamTutar:ucret,indirimliTutar:ucret};
  await apiFetch('/api/servis','POST',data);
  servisForm=null;modal=null;aktifMenu='servisler';render();
}

function mDetay(){
  const s=db.servisler.find(x=>x.id===modalData);if(!s)return'<p>Bulunamadi</p>';const m=getMusteri(s.musteriId);
  return'<h2>Detay - '+s.fisNo+'</h2><div class="flex g2 mb4">'+durumBadge(s.durum)+(s.atananKullanici?'<span class="b b-is">Atanan: '+getKullaniciAd(s.atananKullanici)+'</span>':'')+'</div>'+
    '<div style="background:#f9fafb;padding:12px;border-radius:8px;margin-bottom:10px"><div class="fr"><div><b>Musteri:</b> '+(m?m.adSoyad:'-')+'</div><div><b>Tel:</b> '+(m?m.telefon:'-')+'</div></div><div class="fr"><div><b>Plaka:</b> '+(m?m.plaka||'-':'-')+'</div><div><b>Arac:</b> '+(m?(m.aracMarka||'')+' '+(m.aracModel||''):'-')+'</div></div></div>'+
    '<div style="background:#f9fafb;padding:12px;border-radius:8px;margin-bottom:10px"><div class="flex jcsb"><b>Toplam (KDV Dahil):</b><b style="color:var(--p);font-size:16px">'+para(s.kdvDahilToplam)+'</b></div></div>'+
    (s.sonuc?'<div class="sonuc-alan"><h4>Sonuc</h4><p style="white-space:pre-wrap;font-size:13px">'+s.sonuc+'</p></div>':'')+
    '<div class="ma"><button class="btn btn-ok btn-s" onclick="fisGoster(\''+s.id+'\')">Fis</button><button class="btn btn-g btn-s" onclick="modal=null;render()">Kapat</button></div>';
}

render();
</script>
</body>
